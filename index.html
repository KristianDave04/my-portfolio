<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home</title>
  <link rel="stylesheet" href="ui.css">
  <link rel="icon" type="image/x-icon" href="assets/icons/miss-minute.ico">
</head>
<body class="home-page">

  <!-- ============ 3D TVA Headquarters scene ============ -->
  <div id="tva-scene-root"></div>

  <div id="tva-crosshair" aria-hidden="true"></div>

  <div id="tva-click-to-look">Click to look around</div>
  <div id="tva-move-hint">W A S D to walk</div>

  <div id="tva-interact-prompt">
    <span class="key-badge">E</span>
    <span class="prompt-label">Interact</span>
  </div>

  <div id="tva-joystick-base">
    <div id="tva-joystick-nub"></div>
  </div>

  <!-- ============ Cinematic intro ============ -->
  <div id="cinematic-intro">
    <div id="intro-text"></div>
    <div id="intro-skip-hint">Click or press any key to skip</div>
  </div>

  <!-- ============ Portfolio overlay (opened via the Tempad) ============ -->
  <div id="portfolio-overlay">
    <button id="portfolio-close-btn" type="button">
      <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" stroke-linecap="round"/></svg>
      Exit Tempad
    </button>

    <!-- Ambient depth layers behind the glass -->
    <div class="stage-backdrop"></div>
    <div class="stage-motes">
      <span></span><span></span><span></span><span></span><span></span><span></span>
    </div>

    <!-- Monitor Container -->
    <div class="monitor-container">
      <div class="monitor-rig">
        <div class="screen-frame">
          <div class="crt-overlay"></div>

          <div class="monitor-content">

            <!-- Left Terminal UI -->
            <section class="terminal-ui">
              <div class="terminal-ui-top">
                <div class="temporal-aperture" aria-hidden="true">
                  <svg viewBox="0 0 100 100">
                    <circle class="ring-outer" cx="50" cy="50" r="46"/>
                    <circle class="ring-mid" cx="50" cy="50" r="34"/>
                    <circle class="ring-inner" cx="50" cy="50" r="22"/>
                    <circle class="aperture-core" cx="50" cy="50" r="5"/>
                    <line class="tick" x1="50" y1="4" x2="50" y2="12"/>
                    <line class="tick" x1="50" y1="88" x2="50" y2="96"/>
                    <line class="tick" x1="4" y1="50" x2="12" y2="50"/>
                    <line class="tick" x1="88" y1="50" x2="96" y2="50"/>
                  </svg>
                </div>

                <div class="terminal-eyebrow">TEMPAD OS // ACTIVE SESSION</div>

                <!-- Grid Menu with Clickable Links -->
                <div class="grid-menu">
                  <div class="menu-item">
                    <a href="index.html" class="active-program">
                      <div class="menu-icon-wrap">
                        <svg class="nav-icon" viewBox="0 0 24 24"><path d="M12 3c4 2 4 16 0 18M12 3c-4 2-4 16 0 18M4 12h16" stroke-linecap="round"/><rect x="3" y="3" width="18" height="18" rx="2"/></svg>
                      </div>
                      <span>TIMEDOOR</span>
                    </a>
                  </div>
                  <div class="menu-item">
                    <a href="about.html">
                      <div class="menu-icon-wrap">
                        <svg class="nav-icon" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8" stroke-linecap="round"/></svg>
                      </div>
                      <span>MISS MINUTES</span>
                    </a>
                  </div>
                  <div class="menu-item">
                    <a href="project.html">
                      <div class="menu-icon-wrap">
                        <svg class="nav-icon" viewBox="0 0 24 24"><path d="M4 20V10M4 10a4 4 0 0 1 4-4h4M12 6a4 4 0 0 1 4 4v10M4 6h4M16 16h4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="4" cy="4" r="2" fill="currentColor"/><circle cx="20" cy="20" r="2" fill="currentColor"/></svg>
                      </div>
                      <span>TIMELINE</span>
                    </a>
                  </div>
                  <div class="menu-item">
                    <a href="contact.html">
                      <div class="menu-icon-wrap">
                        <svg class="nav-icon" viewBox="0 0 24 24"><path d="M6 2h9l3 3v17H6z" stroke-linejoin="round"/><path d="M15 2v3h3" stroke-linejoin="round"/><path d="M9 12h6M9 16h6" stroke-linecap="round"/></svg>
                      </div>
                      <span>DOCUMENTS</span>
                    </a>
                  </div>
                </div>
              </div>

              <!-- Footer Stats -->
              <div class="footer-stats">
                <span>05.12.2026</span>
                <span>0231.47 // 307741</span>
              </div>
            </section>

            <!-- Right Profile Card -->
            <section class="profile-card-container">
              <div class="profile-box fade-in">
                <div class="profile-img-wrap">
                  <img src="./assets/personal pic.jpg" alt="ARGATE Profile Picture" class="profile-pic">
                </div>
                <div class="profile-info">
                  <h1 class="glitch-text" data-text="Hi, I am KD">Hi, I am KD</h1>
                  <p class="subject-tag">2nd year | Aspiring Creative Developer &amp; Designer</p>
                  <a href="project.html" class="tva-btn">VIEW SACRED TIMELINE</a>
                </div>
              </div>
            </section>

          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="./vendor/three.min.js"></script>
  <script src="./scene/tva-scene.js"></script>
  <script src="./scene/tva-intro.js"></script>
  <script src="./scene/tva-controls.js"></script>
  <script src="function.js"></script>
</body>
</html>
